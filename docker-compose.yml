# Local stack: PostgreSQL + database migrations + FastAPI API + the web dashboard.
# Usage: copy .env.example to .env, set POSTGRES_PASSWORD, then `docker compose up --build`.
name: chainpilot-ai

# Settings shared by every container that runs the API image (YAML anchor, reused below).
x-api-environment: &api-environment
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-480}
  # Uvicorn trusts X-Forwarded-For (the real client IP) only from these addresses.
  # Locally that is nobody else; behind the AWS load balancer set it to the ALB's subnet.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
  # Inside the Compose network the database host is the service name.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-chainpilot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-chainpilot}
  # AI copilot (P5-T3): Groq or Gemini. Empty key = copilot switched off (503).
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  # Browser pages allowed to call the API: the dev server (5173) and the web container.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
  # LangGraph ships LangSmith tracing; keep it off so run data goes nowhere else.
  LANGSMITH_TRACING: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chainpilot}
      # Required: Compose stops with this message if the password is not set.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chainpilot}
    ports:
      # Bound to localhost only so the database is not reachable from the network.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies database migrations, then exits. The API waits for it.
  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    healthcheck:
      disable: true  # the image's HTTP healthcheck is for the API, not this job
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./apps/api
    environment: *api-environment
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The dashboard: static files served by nginx. The browser calls the API directly,
  # so the API address the browser uses is built into the files.
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${WEB_API_URL:-http://127.0.0.1:8000}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
