[project]
name = "chainpilot-ml"
version = "0.1.0"
description = "ChainPilot AI machine learning: demand forecasting and delivery risk"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../apps/api: the shared inventory policy math (D-044).
pythonpath = [".", "../apps/api"]
# Every warning fails the run, as in the API.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
