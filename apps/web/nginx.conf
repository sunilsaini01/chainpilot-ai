# Serves the built dashboard. Every unknown path returns index.html, so that
# reloading /suppliers or /audit works (the React router handles the path).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Content Security Policy: code, styles and data only from this dashboard and
    # the API (its address is filled in when the image is built, see Dockerfile).
    # No inline scripts, no plugins, no frames. A second wall behind the httpOnly
    # login cookie if a script were ever injected into a page.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    # nginx drops server-level add_header lines in any location that has its own,
    # so the security headers are repeated in each location.
    location / {
        try_files $uri /index.html;
        # index.html names the current bundle, so it must never be cached.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
    }

    # Bundle files have a content hash in their name, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
    }
}
