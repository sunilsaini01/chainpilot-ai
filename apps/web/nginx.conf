# Serves the built dashboard. Every unknown path returns index.html, so that
# reloading /suppliers or /audit works (the React router handles the path).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # nginx drops server-level add_header lines in any location that has its own,
    # so the security headers are repeated in each location.
    location / {
        try_files $uri /index.html;
        # index.html names the current bundle, so it must never be cached.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Bundle files have a content hash in their name, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
