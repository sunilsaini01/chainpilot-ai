# Alembic configuration. The database connection is NOT set here: migrations/env.py
# builds it from the same POSTGRES_* settings the API uses (see app/config.py).
[alembic]
script_location = %(here)s/migrations
# Readable file names: <date>_<revision>_<message>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# Split path lists with the operating system's separator (Alembic 1.16+ setting).
path_separator = os
