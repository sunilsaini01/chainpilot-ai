[project]
name = "chainpilot-api"
version = "0.1.0"
description = "ChainPilot AI backend API (FastAPI + PostgreSQL)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Turn every warning into a failure so new deprecations are noticed early.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
# B008 flags FastAPI's standard `Depends(...)` default-argument pattern.
ignore = ["B008"]
